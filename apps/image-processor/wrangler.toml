name = "makanmasak-image-processor"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8790
local_protocol = "http"
# inspector_port intentionally omitted: pinning it in wrangler.toml triggers
# "*** std::terminate() called" in workerd on Windows (wrangler 4.84.1).
# Let wrangler auto-allocate instead.

# Scheduled cleanup + daily stats (cron runs in UTC; 01:00 UTC = 09:00 台灣時間)
[triggers]
crons = ["0 1 * * *"]

[vars]
IMAGE_API_BASE_URL = "http://localhost:8790"
MAX_IMAGE_SIZE_MB = "10"
MAX_UPLOAD_REQUEST_SIZE_MB = "12"
ALLOWED_MIME_TYPES = "image/jpeg,image/png,image/webp,image/gif"

# Image variants configuration
DEFAULT_VARIANTS = "thumbnail,small,medium,large,original"
THUMBNAIL_SIZE = "150x150"
SMALL_SIZE = "300x300"
MEDIUM_SIZE = "600x600"
LARGE_SIZE = "1200x1200"

# Security settings
MAX_UPLOADS_PER_MINUTE = "20"
MAX_TRANSFORMS_PER_MINUTE = "100"

[env.production]
name = "makanmasak-image-processor-prod"

[[env.production.routes]]
pattern = "images.makanmasak.com"
custom_domain = true

[env.production.vars]
NODE_ENV = "production"
API_VERSION = "v1"
IMAGE_API_BASE_URL = "https://images.makanmasak.com"
CORS_ORIGIN = "https://admin.makanmasak.com"
MAX_IMAGE_SIZE_MB = "10"
MAX_UPLOAD_REQUEST_SIZE_MB = "12"
ALLOWED_MIME_TYPES = "image/jpeg,image/png,image/webp,image/gif"
DEFAULT_VARIANTS = "thumbnail,small,medium,large,original"
THUMBNAIL_SIZE = "150x150"
SMALL_SIZE = "300x300"
MEDIUM_SIZE = "600x600"
LARGE_SIZE = "1200x1200"
MAX_UPLOADS_PER_MINUTE = "20"
MAX_TRANSFORMS_PER_MINUTE = "100"

[[env.production.kv_namespaces]]
binding = "IMAGE_CACHE"
id = "1bdf850866984564b11d66ab5617744d"

[[env.production.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "30ba7daf1e4c41438233542de10dd02f"

[[env.production.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "makanmasak-images-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "makanmasak-prod"
# Provision with: wrangler d1 create makanmasak-prod
database_id = "4e3c7ba8-5aa7-4652-bfea-a9c565b3a141"

# Development environment (local-only — id is unused with `wrangler dev --local`)
[[kv_namespaces]]
binding = "IMAGE_CACHE"
id = "local"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "makanmasak-images-dev"

[[d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
# Provision with: wrangler d1 create makanmakan-local --local
database_id = "local"


# === STAGING ENVIRONMENT ===
# Placeholders (STAGING_*, __WORKERS_SUBDOMAIN__) are filled by
# scripts/staging/provision.cjs. See docs/runbooks/staging.md.
[env.staging]
name = "makanmasak-image-processor-staging"
workers_dev = true

[env.staging.vars]
NODE_ENV = "production"
ENVIRONMENT = "staging"
API_VERSION = "v1"
IMAGE_API_BASE_URL = "https://makanmasak-image-processor-staging.__WORKERS_SUBDOMAIN__.workers.dev"
CORS_ORIGIN = "https://makanmasak-admin-staging.pages.dev"
MAX_IMAGE_SIZE_MB = "10"
MAX_UPLOAD_REQUEST_SIZE_MB = "12"
ALLOWED_MIME_TYPES = "image/jpeg,image/png,image/webp,image/gif"
DEFAULT_VARIANTS = "thumbnail,small,medium,large,original"
THUMBNAIL_SIZE = "150x150"
SMALL_SIZE = "300x300"
MEDIUM_SIZE = "600x600"
LARGE_SIZE = "1200x1200"
MAX_UPLOADS_PER_MINUTE = "20"
MAX_TRANSFORMS_PER_MINUTE = "100"

# The top-level cron is inherited; staging runs no scheduled cleanup.
[env.staging.triggers]
crons = []

[[env.staging.kv_namespaces]]
binding = "IMAGE_CACHE"
id = "STAGING_KV_IMAGE_CACHE_ID"

[[env.staging.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "STAGING_KV_TOKEN_BLACKLIST_ID"

[[env.staging.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "makanmasak-images-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "makanmasak-staging"
database_id = "STAGING_D1_PLATFORM_ID"
