# MakanMasak Management API - Cloudflare Workers Configuration
# Central management platform for hybrid deployment strategy

name = "makanmasak-management-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8789
local_protocol = "http"
# inspector_port intentionally omitted: pinning it in wrangler.toml triggers
# "*** std::terminate() called" in workerd on Windows (wrangler 4.84.1).
# Let wrangler auto-allocate instead.

# Default variables for development
[vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8789"
CORS_ORIGIN = "http://localhost:5177,http://localhost:8789"
LOG_LEVEL = "info"
# Applicant status links are built on this origin (onboarding-app).
ONBOARDING_APP_URL = "http://localhost:3011"
# Onboarding setup-password links are built on this origin (admin-dashboard).
ADMIN_APP_URL = "http://localhost:3001"

# D1 Database binding (management database)
[[d1_databases]]
binding = "MANAGEMENT_DB"
database_name = "makanmakan-management-local"
database_id = "management-local"
migrations_dir = "migrations"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "makanmakan-local"
database_id = "local"
migrations_dir = "../../packages/database/migrations_fresh"

# Shared with the API worker so management changes invalidate API-side cache.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "makanmasak-cache-dev"
preview_id = "makanmasak-cache-preview"

# KV namespace for deployment status tracking
[[kv_namespaces]]
binding = "DEPLOYMENT_STATUS_KV"
id = "makanmasak-deployment-status-dev"
preview_id = "makanmasak-deployment-status-preview"

# R2 bucket for worker bundles
[[r2_buckets]]
binding = "BUNDLE_STORAGE"
bucket_name = "makanmasak-management-bundles-dev"
preview_bucket_name = "makanmasak-management-bundles-preview"

# Cloudflare Email Service provides an independent platform-alert fallback.
# The recipient and sender addresses are environment secrets because they are
# operational contacts; see ONBOARDING_NOTIFICATIONS.md before enabling it.
[[send_email]]
name = "ONBOARDING_NOTIFICATION_EMAIL"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmasak-management-api-prod"
[env.production.vars]
NODE_ENV = "production"
API_VERSION = "v1"
API_BASE_URL = "https://manage-api.makanmasak.com"
CORS_ORIGIN = "https://admin.makanmasak.com,https://management.makanmasak.com,https://onboarding.makanmasak.com"
LOG_LEVEL = "warn"
ONBOARDING_APP_URL = "https://onboarding.makanmasak.com"
ADMIN_APP_URL = "https://admin.makanmasak.com"
# Credential delivery stays manual until a verified Resend sender domain and the
# RESEND_API_KEY secret both exist. Turning this on without them makes every
# approval record a failed delivery instead of the handoff staff actually use.
ONBOARDING_EMAIL_ENABLED = "false"
ONBOARDING_EMAIL_FROM = "onboarding@makanmasak.com"

# Custom domain — wrangler provisions DNS + SSL automatically on deploy
# since the makanmasak.com zone is already on this Cloudflare account.
[[env.production.routes]]
pattern = "manage-api.makanmasak.com"
custom_domain = true

[[env.production.d1_databases]]
binding = "MANAGEMENT_DB"
database_name = "makanmasak-management-prod"
database_id = "0a1f532c-37b5-4b77-8e9f-403cfda307c4"
migrations_dir = "migrations"

[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "makanmasak-prod"
database_id = "4e3c7ba8-5aa7-4652-bfea-a9c565b3a141"
migrations_dir = "../../packages/database/migrations_fresh"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "5850dad46b684f2d8b69b3344d146a1d"

[[env.production.kv_namespaces]]
binding = "DEPLOYMENT_STATUS_KV"
id = "e8da1ab3a04740e48c53a710494c31df"

[[env.production.r2_buckets]]
binding = "BUNDLE_STORAGE"
bucket_name = "makanmasak-management-bundles-prod"

# Onboarding audit snapshots outlive D1 Time Travel's 30 days (#419).
[[env.production.r2_buckets]]
binding = "AUDIT_ARCHIVE"
bucket_name = "makanmasak-backups-prod"

# 18:30 UTC = 02:30 Asia/Taipei. Production only: nothing else has an archive.
[env.production.triggers]
crons = ["30 18 * * *"]

# Bindings do not inherit into named environments. This must be deployed before
# PLATFORM_NOTIFICATION_EMAIL and PLATFORM_NOTIFICATION_EMAIL_FROM can work.
[[env.production.send_email]]
name = "ONBOARDING_NOTIFICATION_EMAIL"


# Secrets (set via wrangler secret put):
# - JWT_SECRET: JWT signing secret for management tokens
# - PLATFORM_CF_API_TOKEN: Platform Cloudflare API token for managed provisioning
# - PLATFORM_CF_ACCOUNT_ID: Platform Cloudflare account ID
# - RESEND_API_KEY: Resend API key used for onboarding credential delivery
# - SLACK_WEBHOOK_URL: Slack webhook for new-application platform alerts
# - PLATFORM_NOTIFICATION_EMAIL: Verified Email Routing destination for the
#   Cloudflare Email Service onboarding-alert fallback
# - PLATFORM_NOTIFICATION_EMAIL_FROM: Sender on a domain onboarded to
#   Cloudflare Email Service
# - CF_API_TOKEN / CF_ACCOUNT_ID: Legacy fallback names for platform provisioning
