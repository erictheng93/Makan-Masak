# MakanMasak API - Cloudflare Workers Configuration
# Updated to use latest wrangler 4.35.0

name = "makanmasak-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Halves the bundle: 3739 KiB raw / 657 KiB gzip -> 1792 / 453.
#
# It does NOT measurably reduce cold starts, despite being enabled for exactly
# that reason. Slow-mode median before: 620ms; after, once isolates settled:
# 626ms. Fast mode 97ms -> 99ms. No change.
#
# The prediction came from fitting cold-start penalty against compressed size
# across three Workers on this account (realtime 78 KiB/+82ms, management-api
# 349 KiB/+284ms, api 657 KiB/+505ms) and extrapolating ~150ms. Three points
# fit any line, so the R² meant nothing, and the one out-of-sample check was
# already 70% off. The likely reason it does not hold: minification shrinks
# identifiers and whitespace, so it cuts bytes transferred but barely changes
# the AST V8 has to parse and compile — and cold start here looks
# compile-bound, not fetch-bound.
#
# Kept because a smaller upload is still worth having and nothing regressed.
# Do not roll this out to the other Workers expecting a latency win, and do not
# reuse that size-to-penalty model. Cloudflare's own advice for startup time is
# to drop dependencies or split via Service bindings — packages/database alone
# is 926 KiB of this bundle.
#
# Safe for this codebase: esbuild's keep_names stays on, so the ApiError
# subclass names survive, and the `error.name === "TokenExpiredError"` checks
# compare against string literals set inside jsonwebtoken, which minification
# does not rewrite.
minify = true

# Development server configuration
[dev]
port = 8787
local_protocol = "http"
# inspector_port intentionally omitted: pinning it in wrangler.toml triggers
# "*** std::terminate() called" in workerd on Windows (wrangler 4.84.1).
# Let wrangler auto-allocate instead.

# Default variables for development
[vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3010,http://localhost:3011"
LOG_LEVEL = "info"
REALTIME_WS_URL = "ws://localhost:8788"
DISCOVERY_EMBEDDING_MODEL = "@cf/baai/bge-m3"

# ===== Deployment Mode Configuration =====
# DEPLOYMENT_MODE: 'saas' (default) or 'independent'
# - saas: Multi-tenant centralized platform (default for development)
# - independent: Single-tenant managed deployment
DEPLOYMENT_MODE = "saas"
# For independent deployments, set these additional variables:
# TENANT_ID = "S-YYYYMMDD-NNN"           # Unique tenant identifier
# TENANT_NAME = "餐廳名稱"                # Display name
# LICENSE_KEY = "MKM-PRO-XXXXXX-XXXX"    # License key
# CENTRAL_API_URL = "https://manage.makanmasak.com"
# PLATFORM_VERSION = "1.0.0"

# JWT_SECRET - SECURITY: Use `wrangler secret put JWT_SECRET` instead of hardcoding
# For local development, set via environment variable or use a local .dev.vars file

# Notification Provider Configuration
# SECURITY: API keys should be set via `wrangler secret put` command
# Email provider (Resend)
NOTIFICATION_FROM_EMAIL = "notifications@makanmasak.com"
# RESEND_API_KEY - Set via: wrangler secret put RESEND_API_KEY
#
# The retired unauthenticated MailChannels relay is not supported. Without a
# RESEND_API_KEY secret the notification provider is disabled.
#
# SMS provider — switching vendors is config only, never code.
# SMS_PROVIDER selects the vendor: "mitake" | "every8d" | "twilio" | "noop".
# Leave it unset (or "auto") to use the first vendor whose credentials are
# present, in cost order: mitake -> every8d -> twilio.
# Implementation + wire formats: packages/database/src/services/sms.ts
#
# SMS_PROVIDER = "mitake"
#
# 三竹簡訊 (Mitake) — enterprise account
#   MITAKE_USERNAME - Set via: wrangler secret put MITAKE_USERNAME
#   MITAKE_PASSWORD - Set via: wrangler secret put MITAKE_PASSWORD
#   MITAKE_API_BASE - only for personal-tier accounts (https://smsb2c.mitake.com.tw)
#
# Every8d (互動資通) — API21
#   EVERY8D_UID - Set via: wrangler secret put EVERY8D_UID
#   EVERY8D_PWD - Set via: wrangler secret put EVERY8D_PWD
#
# Twilio
#   TWILIO_ACCOUNT_SID - Set via: wrangler secret put TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN - Set via: wrangler secret put TWILIO_AUTH_TOKEN
#   TWILIO_PHONE_NUMBER - Set via: wrangler secret put TWILIO_PHONE_NUMBER
#
# TWILIO_PHONE_NUMBER deliberately has no placeholder value. hasTwilio() in
# packages/database/src/services/sms.ts is `SID && TOKEN && PHONE_NUMBER`, so a
# dummy number already counts as "configured": adding just the SID and token
# later would make SMS_PROVIDER=auto pick Twilio and bounce every send on an
# invalid From. Set all three together, or none.

# Brand prefix on outbound OTP messages (TW carriers require an identifiable sender)
OTP_SMS_BRAND = "MakanMasak"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"
migrations_dir = "../../packages/database/migrations_fresh"

[[services]]
binding = "MANAGEMENT_API"
service = "makanmasak-management-api"

# KV namespaces for caching and rate limiting
[[kv_namespaces]]
binding = "CACHE_KV"
id = "makanmasak-cache-dev"
preview_id = "makanmasak-cache-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmasak-ratelimit-dev"
preview_id = "makanmasak-ratelimit-preview"

[[kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmasak-backup-dev"
preview_id = "makanmasak-backup-preview"

# Token Blacklist KV — required by customer OTP login (issueCustomerTokens
# writes the refresh id here) and by token revocation on logout.
[[kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "makanmasak-tokenblacklist-dev"
preview_id = "makanmasak-tokenblacklist-preview"

# R2 bucket for backup storage
[[r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-dev"
preview_bucket_name = "makanmasak-backups-preview"

# Durable Object binding to apps/realtime — needed for RealtimeBroadcastService.
# Without this, env.REALTIME_SESSION is undefined and broadcasts silently no-op
# (see docs/incidents/INC-001). Each env points at the matching realtime worker.
[[durable_objects.bindings]]
name = "REALTIME_SESSION"
class_name = "RealtimeSession"
script_name = "makanmasak-realtime"

# Search-index fan-out queue (this worker is both producer and consumer).
# Create once with: wrangler queues create makanmasak-search-sync-dev
#                   wrangler queues create makanmasak-search-sync-dlq-dev
[[queues.producers]]
binding = "SEARCH_SYNC_QUEUE"
queue = "makanmasak-search-sync-dev"

[[queues.consumers]]
queue = "makanmasak-search-sync-dev"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "makanmasak-search-sync-dlq-dev"

[ai]
binding = "AI"

[[vectorize]]
binding = "DISCOVERY_VECTORIZE"
index_name = "makanmasak-discovery-dev"

# === DEVELOPMENT ENVIRONMENT ===
[env.development]
name = "makanmasak-api-dev"
[env.development.vars]
NODE_ENV = "development"
API_VERSION = "v1"
API_BASE_URL = "http://localhost:8787"
CORS_ORIGIN = "*"
LOG_LEVEL = "debug"
MAX_REQUEST_SIZE = "50MB"
CACHE_TTL = "60"
RATE_LIMIT_REQUESTS = "1000"
DEPLOYMENT_MODE = "saas"
PLATFORM_VERSION = "1.0.0"
REALTIME_WS_URL = "ws://localhost:8788"
DISCOVERY_EMBEDDING_MODEL = "@cf/baai/bge-m3"
# Notification configuration
NOTIFICATION_FROM_EMAIL = "dev-notifications@makanmasak.com"
# Brand prefix on outbound OTP messages. Top-level [vars] is NOT inherited by
# named environments, so this has to be repeated here or the env falls back to
# the "MakanMasak" default hardcoded in buildOtpSmsBody().
OTP_SMS_BRAND = "MakanMasak"

[[env.development.d1_databases]]
binding = "DB"
database_name = "makanmakan-local"
database_id = "local"

[[env.development.services]]
binding = "MANAGEMENT_API"
service = "makanmasak-management-api"

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "makanmasak-cache-dev"

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "makanmasak-ratelimit-dev"

[[env.development.kv_namespaces]]
binding = "BACKUP_KV"
id = "makanmasak-backup-dev"

[[env.development.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "makanmasak-tokenblacklist-dev"

[[env.development.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-dev"

[[env.development.durable_objects.bindings]]
name = "REALTIME_SESSION"
class_name = "RealtimeSession"
script_name = "makanmasak-realtime"

[[env.development.queues.producers]]
binding = "SEARCH_SYNC_QUEUE"
queue = "makanmasak-search-sync-dev"

[[env.development.queues.consumers]]
queue = "makanmasak-search-sync-dev"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "makanmasak-search-sync-dlq-dev"

[env.development.ai]
binding = "AI"

[[env.development.vectorize]]
binding = "DISCOVERY_VECTORIZE"
index_name = "makanmasak-discovery-dev"

# === PRODUCTION ENVIRONMENT ===
[env.production]
name = "makanmasak-api-prod"
[env.production.vars]
NODE_ENV = "production"
API_VERSION = "v1"
# Dataset behind the ANALYTICS binding below. Writes use the binding; reading
# aggregates back needs the dataset name, the account id, and a
# CLOUDFLARE_API_TOKEN secret (Account | Account Analytics | Read).
# The account id is not a secret — it appears in every dashboard URL and in the
# SQL API path itself, and other resource ids are already committed here.
ANALYTICS_DATASET = "makanmasak-metrics-prod"
CLOUDFLARE_ACCOUNT_ID = "bdddc08c066a9abc285d75fe5947a468"
API_BASE_URL = "https://api.makanmasak.com"
# Customer app origin baked into table/seat QR codes and verification links.
# Set explicitly rather than relying on the CORS_ORIGIN[0] fallback, because
# reordering CORS_ORIGIN would silently repoint every QR code that gets printed.
CLIENT_BASE_URL = "https://makanmasak.com"
CORS_ORIGIN = "https://makanmasak.com,https://admin.makanmasak.com,https://kitchen.makanmasak.com"
LOG_LEVEL = "warn"
MAX_REQUEST_SIZE = "5MB"
CACHE_TTL = "600"
RATE_LIMIT_REQUESTS = "100"
DEPLOYMENT_MODE = "saas"
PLATFORM_VERSION = "1.0.0"
CENTRAL_API_URL = "https://manage-api.makanmasak.com"
REALTIME_WS_URL = "wss://realtime.makanmasak.com"
DISCOVERY_EMBEDDING_MODEL = "@cf/baai/bge-m3"
QUOTA_ENFORCEMENT_MODE = "enforce"
# Notification configuration
NOTIFICATION_FROM_EMAIL = "notifications@makanmasak.com"
# Brand prefix on outbound OTP messages. Top-level [vars] is NOT inherited by
# named environments, so this has to be repeated here or the env falls back to
# the "MakanMasak" default hardcoded in buildOtpSmsBody().
OTP_SMS_BRAND = "MakanMasak"

# Custom domain — wrangler provisions DNS + SSL automatically on deploy
# since the makanmasak.com zone is already on this Cloudflare account.
[[env.production.routes]]
pattern = "api.makanmasak.com"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "makanmasak-prod"
database_id = "4e3c7ba8-5aa7-4652-bfea-a9c565b3a141"
migrations_dir = "../../packages/database/migrations_fresh"

[[env.production.services]]
binding = "MANAGEMENT_API"
service = "makanmasak-management-api-prod"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "5850dad46b684f2d8b69b3344d146a1d"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e442a551aa3f484db44fcdfa1084ff81"

[[env.production.ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1001"

  [env.production.ratelimits.simple]
  limit = 100
  period = 60

# Tighter bucket for the public WebSocket token exchange. Its siblings
# (/realtime/auth/guest-token, /realtime/auth/group-token) sit on the KV
# limiter because they take credentials in the body and need a durable counter;
# /auth/token needs only a smaller number, and a second binding buys that for
# no per-request cost. Putting it on KV instead would add 3 reads + 1 write per
# request (~$6.50 per million) and a few hundred ms, to protect an endpoint
# whose only real cost of abuse is Workers and Durable Object time.
#
# `namespace_id` is just a label that has to be unique within this Worker — it
# provisions nothing, so adding a bucket costs a deploy and nothing else.
# Keep `period` at 60: NATIVE_RATE_LIMIT_WINDOW_SECONDS in geo-rate-limiting.ts
# mirrors it to fill Retry-After for every native bucket.
[[env.production.ratelimits]]
name = "AUTH_TOKEN_RATE_LIMITER"
namespace_id = "1002"

  [env.production.ratelimits.simple]
  limit = 20
  period = 60

# Atomic short-window floor for anonymous reservation mutations. The feature
# route's KV limiter retains a longer 15-minute window, but KV's read-modify-
# write counter cannot be the only enforcement boundary under concurrency.
[[env.production.ratelimits]]
name = "PUBLIC_RESERVATION_MUTATION_RATE_LIMITER"
namespace_id = "1003"

  [env.production.ratelimits.simple]
  limit = 5
  period = 60

[[env.production.kv_namespaces]]
binding = "BACKUP_KV"
id = "0f091e2ecc254832b824794e6d6912dc"

# Token Blacklist KV for WebSocket authentication security
[[env.production.kv_namespaces]]
binding = "TOKEN_BLACKLIST"
id = "30ba7daf1e4c41438233542de10dd02f"

[[env.production.r2_buckets]]
binding = "BACKUP_STORAGE"
bucket_name = "makanmasak-backups-prod"

[[env.production.durable_objects.bindings]]
name = "REALTIME_SESSION"
class_name = "RealtimeSession"
script_name = "makanmasak-realtime-prod"

[[env.production.queues.producers]]
binding = "SEARCH_SYNC_QUEUE"
queue = "makanmasak-search-sync-prod"

[[env.production.queues.consumers]]
queue = "makanmasak-search-sync-prod"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "makanmasak-search-sync-dlq-prod"

[env.production.ai]
binding = "AI"

[[env.production.vectorize]]
binding = "DISCOVERY_VECTORIZE"
index_name = "makanmasak-discovery-prod"


# Deliberately no [placement] block. Smart Placement was enabled here and put
# the Worker in North America (observed PDX and ATL) while this Worker's D1
# primary runs in APAC, so every query became a trans-Pacific round trip -- a
# `SELECT 1` measured 115-169ms. It needs "consistent traffic from multiple
# locations" to place well, and at ~1 request/minute it had nothing to work
# with. Without the block the Worker runs at the client edge. That edge is
# not necessarily APAC: Taiwan HiNet requests have also entered at SJC (#369).
# Collect country/colo/ASN baselines before testing an explicit Tokyo region
# hint. See docs/runbooks/worker-placement-369.md and #322 before changing it.

# Analytics for production
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "makanmasak-metrics-prod"

# ========================================
# Cron Triggers (Scheduled Tasks)
# ========================================
[triggers]
# Daily at 2:00 AM UTC: Clean expired verification tokens
# Weekly on Sunday at 3:00 AM UTC: Clean old password change logs
crons = [
  "0 2 * * *",     # Daily token cleanup, storage snapshot, push subscription pruning
  "0 3 * * *",     # Daily usage events TTL cleanup
  "0 3 * * SUN",   # Weekly log cleanup (CF rejects DOW=0; use SUN or 7)
  "30 2 * * *",    # Daily forecast warmup
  # Usage aggregation and payment reconciliation used to share one */5 entry,
  # which meant they could not be tuned apart. Aggregation now has its own
  # hourly tick. The remaining */5 tick is intentionally shared by frequent
  # operational jobs; split it before changing only one job's cadence.
  "0 * * * *",     # Usage meter aggregation
  "*/5 * * * *",   # Market checkout reconciliation, group order expiry sweep
  "15 2 * * *",    # Billing lifecycle: cycle close, trial reaper, reminders
  "0 4 * * *"      # Stored-value credit expiry (breakage)
]

