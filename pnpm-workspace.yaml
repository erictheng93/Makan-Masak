packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/shared/src/i18n'

# pnpm 11 stopped reading settings from package.json#pnpm and restricted
# .npmrc to auth/registry settings, so everything below used to live in one of
# those two files. It is not new configuration -- it is the same configuration
# in the only place pnpm 12 still reads it. Moving it is not optional: pnpm
# ignores the old locations silently, so a stale copy reads as "no overrides"
# rather than as an error.
engineStrict: true
enablePrePostScripts: true

# Was package.json#pnpm.onlyBuiltDependencies. pnpm 11 replaced the four
# build-permission lists with a single name -> boolean map, and naming what may
# build is no longer enough: a dependency shipping an install script that is
# neither allowed nor denied fails the install outright with
# ERR_PNPM_IGNORED_BUILDS. pnpm 10 ignored those same packages silently, so
# every `false` here records the behaviour the repo already had rather than a
# new decision. A new dependency with an install script has to be listed too --
# pnpm writes the placeholder itself and then refuses to install until it is
# resolved.
allowBuilds:
  "better-sqlite3": true
  "workerd": true
  # Chromium comes from `playwright install`, not from this postinstall.
  "@playwright/browser-chromium": false
  "core-js": false
  "esbuild": false
  "protobufjs": false
  "unix-dgram": false
  "vue-demi": false

# Was package.json#pnpm.overrides. Every entry is load-bearing: the security
# pins hold transitive advisories down, and @types/node, jsdom and terser keep
# the workspace on a single vitest/vite instance (see CLAUDE.md -- two vite
# copies mid-load trip ERR_INTERNAL_ASSERTION and fail the whole suite at
# startup).
overrides:
  "esbuild": "^0.25.0"
  "drizzle-orm": "0.45.2"
  "better-sqlite3": "12.6.0"
  "incur>zod": "^4.3.6"
