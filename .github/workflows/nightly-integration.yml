name: 🌙 Nightly Integration Tests

# Runs the `integration` Playwright project — tests/e2e/integration/
# real-workflows.spec.ts, 17 tests, zero `page.route()` — against a real
# `wrangler dev` Worker and a real local D1.
#
# This is the only scheduled job that drives the customer SPA against a real
# backend. `test.yml`'s `e2e-tests` serves `vite preview` with no API behind
# it, and its `admin-real-e2e` covers the admin dashboard only.
#
# The schedule was commented out in 2026-05 ("solo-dev mode"), and while nobody
# was looking the job stopped being runnable at all: it invoked three spec files
# and two SQL files that b936600f had deleted, and it seeded a database the API
# never opened. Unscheduled is how that went unnoticed for four months, so the
# cron is back on.

on:
  schedule:
    # 2 AM UTC+8 (Taiwan time) — 18:00 UTC daily
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: 🔗 Integration Tests (real API)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Same pinned image as test.yml's browser jobs: browsers and system deps
    # are preinstalled and match the @playwright/test version in package.json.
    # Upgrading Playwright means bumping both, in the same PR.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 安裝 pnpm
        # Not corepack — inside this container it exits 0 having fetched
        # nothing and the shim then dies. See the e2e-tests job in test.yml.
        # No version input: the action reads `packageManager`.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        # The customer app runs from source under `vite`, but the Worker
        # imports workspace packages from their build output.
        run: pnpm --filter @makanmasak/api^... build

      - name: 🔐 寫入 CI dev.vars
        # .dev.vars is gitignored, so CI writes its own:
        #   - JWT_SECRET >= 32 chars, or authMiddleware 500s on
        #     SERVER_CONFIG_ERROR instead of authenticating.
        #   - QR_SIGNING_KEY, because table/seat QR paths throw without it.
        #   - CORS_ORIGIN covering the ports the SPAs are served on.
        run: |
          cat > apps/api/.dev.vars <<'EOF'
          JWT_SECRET=ci-integration-gate-jwt-secret-minimum-32-chars-long
          INTERNAL_API_TOKEN=ci-integration-internal-token-minimum-32-chars-long
          QR_SIGNING_KEY=ci-integration-qr-signing-key-minimum-32-chars-long
          CORS_ORIGIN=http://localhost:3000,http://localhost:3001,http://localhost:3002
          NODE_ENV=test
          EOF

      - name: 🗄️ Migrate + seed 本地 D1
        # Both root scripts pass --persist-to ./.wrangler/shared-state, which is
        # the state directory the API opens below. Running wrangler from
        # apps/api without that flag writes to apps/api/.wrangler/state instead
        # — a database nothing reads. That is what this job used to do, and the
        # reason its seeded accounts were invisible to the API.
        #
        # db:seed:local:e2e adds what real-workflows.spec.ts discovers its
        # fixtures from — a table and two available menu items. Without it the
        # spec skips every customer flow on "local discovery failed" and the
        # job goes green having checked one page load.
        run: |
          pnpm db:migrate:local:api
          pnpm db:seed:local
          pnpm db:seed:local:e2e

      - name: 🚀 啟動 API 與 customer app
        # `vite` (dev), not `vite preview`: dev applies server.proxy, which is
        # what puts the Worker behind the SPA's relative /api/v1 calls.
        # `preview` does not proxy, so the customer app had no API behind it.
        #
        # `--local` is load-bearing, not decoration. apps/api/wrangler.toml
        # declares an [ai] binding, and AI has no local emulation: without this
        # flag wrangler opens a remote proxy session for it, which in a
        # non-interactive shell dies with "it's necessary to set a
        # CLOUDFLARE_API_TOKEN environment variable" and takes the whole Worker
        # with it — the dev server never binds 8787 and every probe below times
        # out. `--local` disables remote bindings, so env.AI reports "not
        # supported" (nothing under test calls it) and the Worker starts.
        run: |
          mkdir -p /tmp/integration-logs
          (cd apps/api && pnpm exec wrangler dev --local \
             --persist-to ../../.wrangler/shared-state \
             > /tmp/integration-logs/api.log 2>&1 &)
          (cd apps/customer-app && pnpm exec vite --port 3000 --host 0.0.0.0 \
             > /tmp/integration-logs/customer.log 2>&1 &)

      - name: ⏳ 等待服務就緒
        # /info is the app-level public endpoint (apps/api/src/app-factory.ts).
        # There is no unauthenticated /api/v1/health.
        run: |
          for probe in http://localhost:8787/info http://localhost:3000; do
            elapsed=0
            until curl -sf "$probe" >/dev/null 2>&1; do
              if [ "$elapsed" -ge 240 ]; then
                echo "::error::$probe did not respond within 240s"
                tail -n 100 /tmp/integration-logs/*.log || true
                exit 1
              fi
              sleep 2
              elapsed=$((elapsed + 2))
            done
            echo "$probe ready in ${elapsed}s"
          done

      - name: 🔎 驗證 seed 落在 API 讀取的資料庫
        # Fails loudly here rather than letting every test skip with
        # "local discovery failed". Checks both halves of the old breakage:
        # the restaurant row (seeded data reachable at all) and an owner1
        # login (the account scripts/seed-local.sql actually creates — the
        # grandmaShop/password123 pair this job used to assume came from
        # scripts/seed-mock-data.sql and 401s since it was deleted).
        env:
          RESTAURANT_ID: 019469a0-0099-7000-8000-000000000099
        run: |
          # `set -eu`, not `set -euo pipefail`: a container job's default shell
          # here is `sh -e {0}` (dash), which rejects `-o pipefail` outright and
          # takes the step down with it. Nothing below is a pipeline anyway.
          set -eu

          cat > /tmp/assert-seed.cjs <<'NODE'
          const [, , label, requiredPath, raw] = process.argv;
          let body;
          try {
            body = JSON.parse(raw);
          } catch {
            console.error(`${label}: response was not JSON: ${raw.slice(0, 300)}`);
            process.exit(1);
          }
          const value = requiredPath
            .split(".")
            .reduce((node, key) => (node == null ? node : node[key]), body);
          if (!body.success || !value) {
            console.error(`${label}: missing ${requiredPath} in ${raw.slice(0, 300)}`);
            process.exit(1);
          }
          console.log(`${label}: ok (${requiredPath}=${value})`);
          NODE

          RESTAURANT_BODY=$(curl --fail --silent --show-error \
            "http://localhost:8787/api/v1/restaurants/${RESTAURANT_ID}")
          node /tmp/assert-seed.cjs "seeded restaurant readable" "data.id" "$RESTAURANT_BODY"

          LOGIN_BODY=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"username":"owner1","password":"owner123"}' \
            "http://localhost:8787/api/v1/auth/login")
          node /tmp/assert-seed.cjs "owner1 login" "data.token" "$LOGIN_BODY"

          MENU_BODY=$(curl --fail --silent --show-error \
            "http://localhost:8787/api/v1/menu/${RESTAURANT_ID}")
          node /tmp/assert-seed.cjs "e2e menu fixtures visible" "data.menuItems.0.id" "$MENU_BODY"

      - name: 🧪 執行 Integration Tests
        # By project name, not by file list: the previous file list named three
        # specs that no longer exist, which is only discoverable by running it.
        # --workers=1 overrides the root config's CI default of 2; these tests
        # share one restaurant's rows in a real D1 (cash_shifts, coupon
        # used_count, idempotency keys, the active-order dedup KV), and 2
        # workers produced cross-file contention.
        #
        # Not run under WORKFLOW_STRICT: most of this spec needs services this
        # job deliberately does not stand up (the admin dashboard — covered by
        # test.yml's admin-real-e2e — plus the kitchen display, management
        # portal, management API and onboarding app), and strict mode turns
        # every one of those skips into a failure. The summary step below
        # prints passed/failed/skipped so a green tick is not read as "all 17
        # ran".
        run: pnpm exec playwright test --project=integration --workers=1
        env:
          WORKFLOW_API_URL: http://localhost:8787
          WORKFLOW_CUSTOMER_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:3000
          WORKFLOW_AUTH_USERNAME: owner1
          WORKFLOW_AUTH_PASSWORD: owner123
          # Fixed ids from scripts/seed-e2e-fixtures.sql.
          WORKFLOW_RESTAURANT_ID: 019469a0-0099-7000-8000-000000000099
          WORKFLOW_TABLE_ID: "9001"
          WORKFLOW_MENU_ITEM_ID: "9001"

      - name: 🛑 停止服務
        if: always()
        run: |
          pkill -f "wrangler dev" || true
          pkill -f "vite" || true

      - name: 📎 上傳日誌與報告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-logs-and-report
          path: |
            /tmp/integration-logs/
            playwright-report/
            test-results/
          retention-days: 14

      - name: 📊 生成測試摘要
        # A pass count is not the interesting number here — a skipped test
        # reads like a passing one in a green tick, and most of this spec
        # skips. The per-test table is what says which of the 17 actually ran.
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## 🌙 Nightly Integration Tests"
            echo ""
            echo "**分支**: ${BRANCH_NAME}"
            echo "**時間**: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "\`playwright test --project=integration\` — tests/e2e/integration/real-workflows.spec.ts"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          cat > /tmp/summarize.cjs <<'NODE'
          const fs = require("node:fs");

          const reportPath = "playwright-report/results.json";
          if (!fs.existsSync(reportPath)) {
            console.log("No results.json — the run did not reach Playwright.");
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const rows = [];
          const walk = (suite) => {
            for (const spec of suite.specs ?? []) {
              const result = spec.tests?.[0]?.results?.[0];
              rows.push({
                title: spec.title,
                status: result?.status ?? "unknown",
                note:
                  result?.error?.message?.split("\n")[0] ??
                  result?.errors?.[0]?.message?.split("\n")[0] ??
                  "",
              });
            }
            for (const child of suite.suites ?? []) walk(child);
          };
          for (const suite of report.suites ?? []) walk(suite);

          const tally = {};
          for (const row of rows) tally[row.status] = (tally[row.status] ?? 0) + 1;

          const lines = ["| 結果 | 數量 |", "| --- | --- |"];
          for (const [status, count] of Object.entries(tally)) {
            lines.push(`| ${status} | ${count} |`);
          }
          const cell = (text) => text.replace(/\|/g, "\\|");
          lines.push("", "| 測試 | 結果 | 備註 |", "| --- | --- | --- |");
          for (const row of rows) {
            lines.push(`| ${cell(row.title)} | ${row.status} | ${cell(row.note)} |`);
          }
          console.log(lines.join("\n"));
          NODE

          node /tmp/summarize.cjs >> "$GITHUB_STEP_SUMMARY"
