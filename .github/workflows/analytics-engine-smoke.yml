name: 📈 Analytics Engine SQL smoke

# Split out of nightly-integration.yml. At the time, that workflow's cron was
# commented out and its integration-tests job had been broken since May, so
# anything living inside it never ran on a schedule and would have been drowned
# in a red run if it did. Both are fixed (#357) and the two now run on the same
# cron, but this check still stands alone on purpose: it takes ~35 seconds and
# needs nothing but a token, where the integration job needs a Worker, a D1 and
# a browser. Keeping them separate keeps this one's verdict readable.
on:
  schedule:
    # 02:00 UTC+8 (Taiwan) — 18:00 UTC daily
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  smoke:
    name: 📈 Query the real SQL API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Sends the real monitoring aggregate query to Analytics Engine. The unit
    # tests around that query mock fetch, so they only check what the SQL string
    # looks like — they cannot tell whether Analytics Engine accepts it. Both
    # syntax bugs it has had (backtick-quoted dataset name, toUInt32OrZero) were
    # found from a production 422 instead.
    #
    # Needs a token with Account | Account Analytics | Read, held in
    # CLOUDFLARE_ANALYTICS_READ_TOKEN — deliberately not the deploy token, so
    # this does not widen that token's scope.
    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 📈 查詢真實 Analytics Engine SQL API
        working-directory: apps/api
        env:
          # Not a secret and deliberately not read from one: the repo has no
          # CLOUDFLARE_ACCOUNT_ID secret, so depending on it made this job fail
          # with "credentials not all set" even once the token was in place. The
          # account id is in every dashboard URL and in the SQL API path, and
          # already lives in apps/api/wrangler.toml.
          CLOUDFLARE_ACCOUNT_ID: bdddc08c066a9abc285d75fe5947a468
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
          ANALYTICS_DATASET: makanmasak-metrics-prod
          # With the secret configured, absent credentials are a hard failure
          # rather than a silent skip — a skipped test reads like a passing one
          # in a CI summary, and silently skipped verification is the failure
          # mode this check exists to catch.
          REQUIRE_ANALYTICS_ENGINE_SMOKE: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN != '' && '1' || '0' }}
        run: pnpm exec vitest run --config vitest.real-integration.config.ts analytics-engine-sql

      - name: 📊 摘要
        if: always()
        env:
          # Through env rather than interpolated into the script text, so the
          # value never becomes part of a command line.
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN != '' && '1' || '' }}
        run: |
          {
            echo "## 📈 Analytics Engine SQL smoke"
            echo ""
            if [ -n "$HAS_TOKEN" ]; then
              echo "Ran against the real SQL API."
            else
              echo "⚠️ **Skipped** — \`CLOUDFLARE_ANALYTICS_READ_TOKEN\` is not configured."
              echo ""
              echo "The query is therefore unverified against the real API. Create a"
              echo "token with **Account | Account Analytics | Read** and add it as that"
              echo "repo secret to enable this check."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
