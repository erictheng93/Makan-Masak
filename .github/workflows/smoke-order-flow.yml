name: 🔥 Production order-flow smoke

# Manual only. Run it after deploying api, realtime, customer-app, admin-dashboard
# or kitchen-display. It creates its own restaurant on production and deletes it
# again (scripts/smoke-order-flow.mjs).
#
# Needs two repository secrets, an administrator-tier account:
#   SMOKE_ADMIN_USERNAME, SMOKE_ADMIN_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: 🔥 diner -> owner -> kitchen -> diner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🌐 安裝 Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 🔥 Run smoke check
        env:
          SMOKE_ADMIN_USERNAME: ${{ secrets.SMOKE_ADMIN_USERNAME }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_ARTIFACTS: ${{ github.workspace }}/smoke-artifacts
        run: pnpm smoke:order-flow

      - name: 📸 Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-order-flow-screenshots
          path: smoke-artifacts/
          if-no-files-found: ignore
