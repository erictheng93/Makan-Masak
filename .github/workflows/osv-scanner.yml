# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/osv-scanner.yml"
      - "osv-scanner.toml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/check-dependency-security.cjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
  merge_group:
    branches: ["main"]
  schedule:
    - cron: "40 21 * * 3"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/osv-scanner.yml"
      - "osv-scanner.toml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "scripts/check-dependency-security.cjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"

# Only the latest scan for a branch/PR is useful; weekly scans use their own ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read
  # Required by osv-scanner-action v2.3.5+; reusable workflows upload SARIF via
  # github/codeql-action, which requires actions: read.
  actions: read

jobs:
  validate-local-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-dependency-security.cjs

  scan-scheduled:
    needs: validate-local-fixes
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        ./

  scan-pr:
    needs: validate-local-fixes
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      scan-args: |-
        -r
        ./
