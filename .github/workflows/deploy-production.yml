name: 🚀 Production Deploy

# Deploys to production from main after explicit manual confirmation.
# The auto workflow_run chain remains disabled until this repository has a
# supported required-reviewer environment gate or an equivalent approval process.
#
# The GitHub 'production' environment is configured with a main-only deployment
# branch policy. Required reviewers are not enabled because GitHub returned 422
# for environment reviewer protection on the current repository plan.

on:
  # Auto-deploy chain via workflow_run is temporarily DISABLED while:
  #   - required-reviewer protection is unavailable on the current GitHub plan
  #   - production deploys should remain an explicit operator action
  # Re-enable only after the approval gate is enforceable.
  # workflow_run:
  #   workflows: ["🧪 MakanMasak 測試流水線"]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "DEPLOY PRODUCTION" to deploy main to production.'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "22"

jobs:
  # Manual operator gate. Before dispatching, verify that the latest main CI
  # run is green; this workflow only validates the explicit confirmation text.
  check-tests:
    name: ✅ 確認測試通過
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        inputs.confirm_production == 'DEPLOY PRODUCTION') ||
      github.event.workflow_run.conclusion == 'success'


    steps:
      - run: echo "Production deploy gate passed."

  deploy-production:
    name: 🚀 部署到正式環境
    runs-on: ubuntu-latest
    needs: check-tests
    environment: production
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置應用程式
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: 🚀 部署到 Cloudflare (Production)
        run: pnpm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: ⏳ 等待部署生效
        run: sleep 15

      - name: 🧪 部署後煙霧測試
        run: |
          set -u

          # Every probe asserts on the response body, never on the status code
          # alone. The Pages apps answer 200 with their index.html for *any*
          # path, so a status-only check against /info passes even when the API
          # is down. That is not hypothetical: PRODUCTION_URL used to be shared
          # by the API probe and the customer-app probe, and no single value can
          # be both — one of those two checks was always meaningless.
          #
          # Public unauthenticated routes only (CLAUDE.md "Debug Tools"):
          # /api/v1/health does NOT exist, and /health 302-redirects to
          # /api/v1/monitoring/health which is auth-gated.
          failed=0
          probe() {
            name="$1"; url="$2"; expect="$3"
            if [ -z "$url" ]; then
              echo "FAIL $name: URL is empty — check the production environment secrets"
              failed=1
              return
            fi
            if ! body=$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 20 "$url" 2>&1); then
              echo "FAIL $name: $url — $body"
              failed=1
            elif ! printf '%s' "$body" | grep -qF -- "$expect"; then
              echo "FAIL $name: $url answered, but without '$expect'"
              failed=1
            else
              echo "OK   $name: $url"
            fi
          }

          # JSON markers — an HTML fallback cannot satisfy these, and
          # "environment":"production" additionally proves the production
          # environment was deployed rather than a preview.
          probe "API" "${PRODUCTION_URL}/info" '"environment":"production"'
          probe "Image processor" "https://images.makanmasak.com/info" '"service":"MakanMasak Image Processor"'

          # Mount-point marker rather than <title>: the title is user-facing
          # copy, and failing a deploy over a wording change would only teach
          # people to ignore this step.
          probe "Customer app" "${PRODUCTION_CUSTOMER_URL}" '<div id="app"'
          probe "Kitchen display" "${PRODUCTION_KITCHEN_URL}" '<div id="app"'

          exit "$failed"
        env:
          # Three distinct hosts. PRODUCTION_URL is the API origin
          # (https://api.makanmasak.com); pointing it at the customer app makes
          # the API probe pass on an HTML page.
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          PRODUCTION_CUSTOMER_URL: ${{ secrets.PRODUCTION_CUSTOMER_URL }}
          PRODUCTION_KITCHEN_URL: ${{ secrets.PRODUCTION_KITCHEN_URL }}

      - name: 📊 部署摘要
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          JOB_STATUS="${{ job.status }}"
          {
            echo "## 🚀 Production Deploy"
            echo ""
            echo "**Commit**: ${COMMIT_SHA}"
            echo "**時間**: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ "$JOB_STATUS" == "success" ]; then
              echo "### ✅ 部署成功"
            else
              echo "### ❌ 部署失敗 — 請檢查 logs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
