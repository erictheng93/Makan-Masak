name: 🧪 MakanMasak 測試流水線

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same PR when a new commit lands so reviewers
# only see the latest result. On push to main we never cancel: this repo has
# no branch protection and allows direct pushes, so a cancelled run would
# leave a commit sitting on main with no CI verdict at all, and the manual
# production deploy gate relies on "is main green?" being answerable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  changes:
    name: 🔎 變更範圍判斷
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
      tooling: ${{ steps.filter.outputs.tooling }}
      guard_tests: ${{ steps.filter.outputs.guard_tests }}
      full_lint: ${{ steps.filter.outputs.full_lint }}
      full: ${{ steps.filter.outputs.full }}
      turbo_base: ${{ steps.filter.outputs.turbo_base }}
      turbo_head: ${{ steps.filter.outputs.turbo_head }}

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔎 分類變更
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            head="${{ github.sha }}"
          fi

          if [ -z "${base:-}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            full=true
            files="$(git ls-files)"
          else
            full=false
            files="$(git diff --name-only "$base" "$head")"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            full=true
          fi

          scope="$(printf '%s\n' "$files" | bash scripts/classify-ci-changes.sh "$full")"
          printf '%s\n' "$scope" >> "$GITHUB_OUTPUT"

          app="$(printf '%s\n' "$scope" | sed -n 's/^app=//p')"
          backend="$(printf '%s\n' "$scope" | sed -n 's/^backend=//p')"
          frontend="$(printf '%s\n' "$scope" | sed -n 's/^frontend=//p')"
          integration="$(printf '%s\n' "$scope" | sed -n 's/^integration=//p')"
          tooling="$(printf '%s\n' "$scope" | sed -n 's/^tooling=//p')"
          guard_tests="$(printf '%s\n' "$scope" | sed -n 's/^guard_tests=//p')"
          full_lint="$(printf '%s\n' "$scope" | sed -n 's/^full_lint=//p')"
          full="$(printf '%s\n' "$scope" | sed -n 's/^full=//p')"

          {
            echo "turbo_base=$base"
            echo "turbo_head=$head"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 變更範圍"
            echo ""
            echo "- app: $app"
            echo "- backend: $backend"
            echo "- frontend: $frontend"
            echo "- integration: $integration"
            echo "- tooling: $tooling"
            echo "- guard tests: $guard_tests"
            echo "- full lint: $full_lint"
            echo "- full: $full"
          } >> "$GITHUB_STEP_SUMMARY"

  # 程式碼品質檢查
  lint-and-typecheck:
    name: 📝 程式碼檢查
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.tooling == 'true'
    timeout-minutes: 15
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.turbo_base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.turbo_head }}

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🧾 GitHub Actions workflow lint
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      # Only this job for now. Turbo's artifact store shares the repo's 10GB
      # GitHub cache budget with the pnpm store above, so it is deliberately
      # scoped to one job until a few runs show the hit rate is worth the
      # eviction pressure it puts on that pnpm cache.
      - name: ⚡ Turbo 任務快取
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-typecheck-${{ runner.os }}-

      - name: 🔍 ESLint 檢查
        run: |
          if [ "${{ needs.changes.outputs.full }}" = "true" ] || \
             [ "${{ needs.changes.outputs.full_lint }}" = "true" ]; then
            pnpm run lint
          else
            pnpm exec turbo run lint --affected
          fi

      - name: 🧼 確認 lint 沒有修改檔案
        run: git diff --exit-code

      - name: 🎯 TypeScript 型別檢查
        run: |
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            pnpm run typecheck
          else
            pnpm exec turbo run typecheck --affected
          fi

      # tests/ is not a workspace package, so turbo cannot schedule it.
      - name: 🎯 Root tests TypeScript 型別檢查
        run: pnpm run typecheck:tests

      - name: 🌐 i18n locale coverage warning
        run: pnpm run check:i18n-locales

      - name: 💅 Prettier 格式檢查
        run: pnpm exec prettier --check "**/*.{ts,js,cjs,mjs,vue,json,md}"

      - name: 🔒 整合測試白名單檢查
        run: node scripts/check-integration-allowlist.cjs

      # Keeps `turbo run test` executable per package: a bare `vitest` is watch
      # mode and hangs the run, and a package without its own vitest.config.*
      # resolves the ROOT config and dies on its `projects` entries.
      - name: 🧩 Package test script 檢查
        run: pnpm run check:test-scripts

      - name: 🚦 Production config 檢查
        run: pnpm run check:prod-config
        env:
          CHECK_PRODUCTION_CONFIG_REQUIRE_DEPLOYMENT_SECRETS: "false"

      - name: 🧭 Migration dual-track guard
        run: pnpm run check:migration-dual-track

      # wrangler auto-answers its own destructive-command confirmation with
      # "yes" when stdin is not a terminal, so d1 time-travel restore, d1 delete
      # and wrangler delete must never reach automation.
      - name: 🛑 No destructive wrangler commands in automation
        run: pnpm run check:no-automated-destructive-wrangler

      # verify.sh runs this in its push tier, but that tier is local and
      # therefore skippable -- which is the whole reason #319's 1,507
      # arbitrary-colour classes accumulated. The guard lived only in
      # .husky/pre-commit, and there it crashed on Windows instead of running.
      # A palette rule that no unskippable gate enforces decays back to advice.
      - name: 🎨 Design palette guard
        run: pnpm run check:design-palette

      # The response-contract snapshot. It compares every field path and its
      # Zod type against .api-contracts-snapshot.json, so a field that changes
      # type -- an ISO string becoming Unix milliseconds -- fails here. Before
      # 2026-09-06 the script ran from no gate at all, and stored names only.
      - name: 📐 API contract snapshot
        run: pnpm run contract:check

      - name: 🧪 守門腳本回歸測試
        if: needs.changes.outputs.guard_tests == 'true'
        run: pnpm run test:ci-guards

  # 單元測試
  unit-tests:
    name: 🧪 單元測試
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.turbo_base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.turbo_head }}

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        # The Vitest workspace always executes every project, so its package
        # entry points must exist even when the changed source scope is narrow.
        # Building packages only avoids the unrelated frontend/Worker builds.
        run: pnpm exec turbo run build --filter="./packages/**"

      - name: 🧪 執行所有單元測試
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p test-results
          pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=./test-results/unit-tests.json

      - name: 📊 產生覆蓋率報告
        # On main/manual, coverage is the test run; do not run Vitest twice.
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p test-results
          pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile.json=./test-results/unit-tests.json

      - name: 🚦 驗證 Vitest suite 結果
        if: always()
        run: pnpm run check:vitest-results test-results/unit-tests.json

      - name: ☂️ 上傳覆蓋率到 Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unit-tests
          name: unit-tests

      - name: 📎 上傳測試結果
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || github.event_name != 'pull_request'
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # Real integration 測試 (miniflare D1 + 真 drizzle)
  #
  # Runs app test files that need real API/DB boundaries via each app's
  # vitest.real-integration.config.ts. These configs serialise files
  # (fileParallelism: false, maxWorkers: 1) because Miniflare/workerd IPC and
  # real D1 setup fail under parallel boot pressure. The default vitest config's
  # shorter timeout and broad parallelism are too tight for these tests.
  #
  # Before this job existed, these tests either flaked in unit-tests
  # (when named *.test.ts) or ran nowhere (when named
  # *.real.integration.test.ts, excluded from the default config but
  # never invoked in CI).
  #
  real-integration-tests:
    name: 🗄️ Real Integration 測試
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.integration == 'true' || needs.changes.outputs.full == 'true'
    timeout-minutes: 25

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        run: pnpm --filter @makanmasak/api^... build

      - name: 🗄️ 執行 real-integration 測試
        run: pnpm test:real-integration

  # E2E 測試 (mock API — no real backend needed)
  #
  # All customer/journey tests use page.route() mocks from
  # tests/e2e/helpers/mock-api.ts to intercept API calls. Admin tests
  # use preAuthAdmin() + mock routes. Integration tests (real API) are
  # excluded — they require a live backend and should run in nightly CI.
  #
  # Runs inside the pinned Playwright Linux container so browser binaries
  # and system dependencies are pre-installed. Upgrading Playwright
  # requires bumping BOTH the image tag below AND the @playwright/test
  # version in package.json in the same PR.
  e2e-tests:
    name: 🎭 E2E 測試
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.full == 'true'))
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 啟用 pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置 customer-app + admin-dashboard + kitchen-display
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          pnpm build \
            --filter=makanmasak-customer-app \
            --filter=makanmasak-admin-dashboard \
            --filter=makanmasak-kitchen-display

      - name: 🚀 啟動 preview servers
        run: |
          mkdir -p /tmp/preview-logs
          (cd apps/customer-app    && pnpm exec vite preview --port 3000 --host 0.0.0.0 > /tmp/preview-logs/customer.log 2>&1 &)
          (cd apps/admin-dashboard && pnpm exec vite preview --port 3001 --host 0.0.0.0 > /tmp/preview-logs/admin.log    2>&1 &)
          (cd apps/kitchen-display && pnpm exec vite preview --port 3002 --host 0.0.0.0 > /tmp/preview-logs/kitchen.log  2>&1 &)

      - name: ⏳ 等待 preview servers 就緒
        run: |
          if ! node <<'NODE'
          (async () => {
          const urls = [
            "http://localhost:3000",
            "http://localhost:3001",
            "http://localhost:3002",
          ];
          const deadline = Date.now() + 60_000;

          for (;;) {
            const pending = [];

            for (const url of urls) {
              try {
                const response = await fetch(url);
                if (!response.ok) pending.push(`${url} -> ${response.status}`);
              } catch (error) {
                pending.push(`${url} -> ${error.cause?.code ?? error.message}`);
              }
            }

            if (pending.length === 0) {
              console.log(`Preview servers ready: ${urls.join(", ")}`);
              process.exit(0);
            }

            if (Date.now() >= deadline) {
              console.error(`Timed out waiting for preview servers:`);
              for (const item of pending) console.error(`- ${item}`);
              process.exit(1);
            }

            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          })();
          NODE
          then
            echo "customer preview log:"
            cat /tmp/preview-logs/customer.log || true
            echo "admin preview log:"
            cat /tmp/preview-logs/admin.log || true
            echo "kitchen preview log:"
            cat /tmp/preview-logs/kitchen.log || true
            exit 1
          fi

      - name: 🧪 執行 E2E 測試
        # Pushes run a small preview smoke because the full Chromium/Admin E2E
        # suite is currently too large and flaky for fast-feedback CI.
        # Manual dispatch keeps the full suite available for investigation.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm exec playwright test --project=chromium --project=admin
          else
            pnpm exec playwright test --config playwright.ci-smoke.config.ts
          fi
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_URL: http://localhost:3001
          E2E_KITCHEN_URL: http://localhost:3002

      - name: 🛑 停止測試服務器
        if: always()
        run: |
          pkill -f "vite preview" || true

      - name: 📎 上傳測試報告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

      - name: 📸 上傳測試截圖
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots-e2e
          path: test-results/
          retention-days: 7
