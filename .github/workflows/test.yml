name: 🧪 MakanMasak 測試流水線

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same PR when a new commit lands so reviewers
# only see the latest result. On push to main we never cancel: this repo has
# no branch protection and allows direct pushes, so a cancelled run would
# leave a commit sitting on main with no CI verdict at all, and the manual
# production deploy gate relies on "is main green?" being answerable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  changes:
    name: 🔎 變更範圍判斷
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
      tooling: ${{ steps.filter.outputs.tooling }}
      guard_tests: ${{ steps.filter.outputs.guard_tests }}
      full_lint: ${{ steps.filter.outputs.full_lint }}
      full: ${{ steps.filter.outputs.full }}
      turbo_base: ${{ steps.filter.outputs.turbo_base }}
      turbo_head: ${{ steps.filter.outputs.turbo_head }}

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔎 分類變更
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            head="${{ github.sha }}"
          fi

          if [ -z "${base:-}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            full=true
            files="$(git ls-files)"
          else
            full=false
            files="$(git diff --name-only "$base" "$head")"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            full=true
          fi

          scope="$(printf '%s\n' "$files" | bash scripts/classify-ci-changes.sh "$full")"
          printf '%s\n' "$scope" >> "$GITHUB_OUTPUT"

          app="$(printf '%s\n' "$scope" | sed -n 's/^app=//p')"
          backend="$(printf '%s\n' "$scope" | sed -n 's/^backend=//p')"
          frontend="$(printf '%s\n' "$scope" | sed -n 's/^frontend=//p')"
          integration="$(printf '%s\n' "$scope" | sed -n 's/^integration=//p')"
          tooling="$(printf '%s\n' "$scope" | sed -n 's/^tooling=//p')"
          guard_tests="$(printf '%s\n' "$scope" | sed -n 's/^guard_tests=//p')"
          full_lint="$(printf '%s\n' "$scope" | sed -n 's/^full_lint=//p')"
          full="$(printf '%s\n' "$scope" | sed -n 's/^full=//p')"

          {
            echo "turbo_base=$base"
            echo "turbo_head=$head"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 變更範圍"
            echo ""
            echo "- app: $app"
            echo "- backend: $backend"
            echo "- frontend: $frontend"
            echo "- integration: $integration"
            echo "- tooling: $tooling"
            echo "- guard tests: $guard_tests"
            echo "- full lint: $full_lint"
            echo "- full: $full"
          } >> "$GITHUB_STEP_SUMMARY"

  # 程式碼品質檢查
  lint-and-typecheck:
    name: 📝 程式碼檢查
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.tooling == 'true'
    timeout-minutes: 15
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.turbo_base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.turbo_head }}

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🧾 GitHub Actions workflow lint
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      # Only this job for now. Turbo's artifact store shares the repo's 10GB
      # GitHub cache budget with the pnpm store above, so it is deliberately
      # scoped to one job until a few runs show the hit rate is worth the
      # eviction pressure it puts on that pnpm cache.
      - name: ⚡ Turbo 任務快取
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-typecheck-${{ runner.os }}-

      - name: 🔍 ESLint 檢查
        run: |
          if [ "${{ needs.changes.outputs.full }}" = "true" ] || \
             [ "${{ needs.changes.outputs.full_lint }}" = "true" ]; then
            pnpm run lint
          else
            pnpm exec turbo run lint --affected
          fi

      - name: 🧼 確認 lint 沒有修改檔案
        run: git diff --exit-code

      - name: 🎯 TypeScript 型別檢查
        run: |
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            pnpm run typecheck
          else
            pnpm exec turbo run typecheck --affected
          fi

      # tests/ is not a workspace package, so turbo cannot schedule it.
      - name: 🎯 Root tests TypeScript 型別檢查
        run: pnpm run typecheck:tests

      - name: 🌐 i18n locale coverage warning
        run: pnpm run check:i18n-locales

      - name: 💅 Prettier 格式檢查
        run: pnpm exec prettier --check "**/*.{ts,js,cjs,mjs,vue,json,md}"

      - name: 🔒 整合測試白名單檢查
        run: node scripts/check-integration-allowlist.cjs

      # Keeps `turbo run test` executable per package: a bare `vitest` is watch
      # mode and hangs the run, and a package without its own vitest.config.*
      # resolves the ROOT config and dies on its `projects` entries.
      - name: 🧩 Package test script 檢查
        run: pnpm run check:test-scripts

      # Two vite copies loaded through the root runner's Promise.all trip
      # ERR_INTERNAL_ASSERTION and fail the whole suite at startup with zero
      # tests run -- about one run in six, which reads as "just re-run it".
      # This is CLAUDE.md's readlink check, run by a gate rather than by hand
      # after someone remembers to (#366).
      - name: 🧵 單一 test runner 實例檢查
        run: pnpm run check:single-test-runner

      - name: 🚦 Production config 檢查
        run: pnpm run check:prod-config
        env:
          CHECK_PRODUCTION_CONFIG_REQUIRE_DEPLOYMENT_SECRETS: "false"

      - name: 🧭 Migration dual-track guard
        run: pnpm run check:migration-dual-track

      # wrangler auto-answers its own destructive-command confirmation with
      # "yes" when stdin is not a terminal, so d1 time-travel restore, d1 delete
      # and wrangler delete must never reach automation.
      - name: 🛑 No destructive wrangler commands in automation
        run: pnpm run check:no-automated-destructive-wrangler

      # verify.sh runs this in its push tier, but that tier is local and
      # therefore skippable -- which is the whole reason #319's 1,507
      # arbitrary-colour classes accumulated. The guard lived only in
      # .husky/pre-commit, and there it crashed on Windows instead of running.
      # A palette rule that no unskippable gate enforces decays back to advice.
      - name: 🎨 Design palette guard
        run: pnpm run check:design-palette

      # The response-contract snapshot. It compares every field path and its
      # Zod type against .api-contracts-snapshot.json, so a field that changes
      # type -- an ISO string becoming Unix milliseconds -- fails here. Before
      # 2026-09-06 the script ran from no gate at all, and stored names only.
      - name: 📐 API contract snapshot
        run: pnpm run contract:check

      # The module counts and the mount index in README.md, docs/api/README.md
      # and docs/architecture/README.md are derived from apps/api/src, so drift
      # means the docs describe an API that is not the one that ships. This ran
      # from no gate at all until #367, and sat red on main with eight findings.
      # It catches the direction that actually caused #367 -- a mount added
      # under apps/api/ without its docs -- because that sets app=true. A
      # docs-only edit classifies as neither app nor tooling and skips this job;
      # verify.sh's push tier is the backstop there.
      - name: 📚 Docs drift guard
        run: pnpm run check:docs-drift

      - name: 🧪 守門腳本回歸測試
        if: needs.changes.outputs.guard_tests == 'true'
        run: pnpm run test:ci-guards

  # 單元測試
  unit-tests:
    name: 🧪 單元測試
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.turbo_base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.turbo_head }}

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        # The Vitest workspace always executes every project, so its package
        # entry points must exist even when the changed source scope is narrow.
        # Building packages only avoids the unrelated frontend/Worker builds.
        run: pnpm exec turbo run build --filter="./packages/**"

      - name: 🧪 單元測試與覆蓋率門檻
        # One step, every event, always with --coverage.
        #
        # The per-glob thresholds in vitest.config.ts are a gate, not a
        # report. Until 2026-09-07 this step was gated on
        # `github.event_name != 'pull_request'` and the PR path ran a
        # coverage-less `vitest run` instead, so the gate only ever ran on the
        # push *after* the merge that broke it. That is not a hypothetical:
        # main sat red from 2026-09-05 to 2026-09-07 because #299 stage A4
        # shipped a CSV export and a whole platform router untested, taking
        # `apps/api/src/features/**` branches to 77.88% against a 78%
        # threshold -- and every one of its PR runs had reported green.
        #
        # Running Vitest twice is still what we refuse to do; this is one run
        # that happens to also collect coverage. Measured cost of the coverage
        # instrumentation on top of the plain run: ~45s (this job went 6.2 ->
        # 7.0 min), against a 20 minute job timeout.
        run: |
          mkdir -p test-results
          pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile.json=./test-results/unit-tests.json

      - name: 🚦 驗證 Vitest suite 結果
        if: always()
        run: pnpm run check:vitest-results test-results/unit-tests.json

      - name: ☂️ 上傳覆蓋率到 Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unit-tests
          name: unit-tests

      - name: 📎 上傳測試結果
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || github.event_name != 'pull_request'
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # Real integration 測試 (miniflare D1 + 真 drizzle)
  #
  # Runs app test files that need real API/DB boundaries via each app's
  # vitest.real-integration.config.ts. These configs serialise files
  # (fileParallelism: false, maxWorkers: 1) because Miniflare/workerd IPC and
  # real D1 setup fail under parallel boot pressure. The default vitest config's
  # shorter timeout and broad parallelism are too tight for these tests.
  #
  # Before this job existed, these tests either flaked in unit-tests
  # (when named *.test.ts) or ran nowhere (when named
  # *.real.integration.test.ts, excluded from the default config but
  # never invoked in CI).
  #
  real-integration-tests:
    name: 🗄️ Real Integration 測試
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.integration == 'true' || needs.changes.outputs.full == 'true'
    timeout-minutes: 25

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 安裝 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 設置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        run: pnpm --filter @makanmasak/api^... build

      - name: 🗄️ 執行 real-integration 測試
        run: pnpm test:real-integration

  # 店家後台 E2E，打真的 API 與真的 D1。
  #
  # Distinct from the e2e-tests job below in the one way that matters: that job
  # serves `vite preview`, which does not apply `server.proxy`, so the admin
  # app's relative `/api/v1` calls have nothing behind them. This job runs
  # `vite dev` against a live `wrangler dev` worker on a migrated + seeded local
  # D1, so every request the browser makes is really served.
  #
  # Runs on pull_request as well as push. The coverage gate was moved onto PRs
  # on 2026-09-07 for exactly this reason — a gate that only runs after the
  # merge reports the breakage to the wrong person, too late. This repo has no
  # branch protection, so a red job here cannot block anyone either way.
  #
  # E2E_STRICT=1 is load-bearing: without it, an unreachable stack or missing
  # fixture turns into a skip, and a skipped suite reads exactly like a passing
  # one in the summary. That is the failure mode this job exists to end.
  admin-real-e2e:
    name: 🖥️ 店家後台 E2E (real API + real D1)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.full == 'true'

    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 安裝 pnpm
        # Not corepack — see the e2e-tests job for why it fake-succeeds in this
        # container. No version input: the action reads packageManager.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置內部套件
        # Only the API's closure is built: it is the side that imports workspace
        # `dist/` output. The admin filter used to be here for @makanmasak/i18n,
        # the one package its closure added over this one that has a build
        # script at all (auth-client and shared publish their source, and
        # ai-analytics / shared-types / database / utils are already in the
        # API's closure). The dev server now resolves i18n from source through
        # the vite alias added for #361, so the extra filter builds nothing the
        # dashboard needs. `tests/unit/workspace-source-aliases.test.ts` guards
        # the alias that makes this safe.
        run: pnpm --filter @makanmasak/api^... build

      - name: 🔐 寫入 CI dev.vars
        # QR_SIGNING_KEY is required, not optional: creating a table,
        # regenerating a QR code and batch-creating seats all throw without it.
        run: |
          cat > apps/api/.dev.vars <<'EOF'
          JWT_SECRET=ci-admin-e2e-jwt-secret-minimum-32-chars-long
          INTERNAL_API_TOKEN=ci-admin-e2e-internal-token-minimum-32-chars-long
          QR_SIGNING_KEY=ci-admin-e2e-qr-signing-key-minimum-32-chars-long
          CORS_ORIGIN=http://localhost:3000,http://localhost:3001,http://localhost:3002
          NODE_ENV=test
          EOF

      - name: 🗄️ Migrate + seed 本地 D1
        # Both scripts pass --persist-to ./.wrangler/shared-state, which is the
        # same state directory apps/api's dev script opens. Running the migrate
        # from apps/api without that flag seeds a database the API never reads.
        run: |
          pnpm db:migrate:local:api
          pnpm db:seed:local
          pnpm exec wrangler d1 execute makanmakan-local --local \
            --persist-to ./.wrangler/shared-state \
            --config=./apps/api/wrangler.toml \
            --file=./scripts/seed-e2e-fixtures.sql

      - name: 🚀 啟動 API 與 admin dashboard
        # AI has no local emulation. Disable remote bindings so startup does
        # not require Cloudflare credentials for these local-D1 tests.
        run: |
          mkdir -p /tmp/admin-e2e-logs
          (cd apps/api && pnpm exec wrangler dev --local \
             --persist-to ../../.wrangler/shared-state \
             > /tmp/admin-e2e-logs/api.log 2>&1 &)
          (cd apps/admin-dashboard && pnpm exec vite --port 3001 --host 0.0.0.0 \
             > /tmp/admin-e2e-logs/admin.log 2>&1 &)

      - name: ⏳ 等待服務就緒
        run: |
          for probe in http://localhost:8787/info http://localhost:3001; do
            elapsed=0
            until curl -sf "$probe" >/dev/null 2>&1; do
              if [ "$elapsed" -ge 150 ]; then
                echo "::error::$probe did not respond within 150s"
                tail -n 100 /tmp/admin-e2e-logs/*.log || true
                exit 1
              fi
              sleep 2
              elapsed=$((elapsed + 2))
            done
            echo "$probe ready in ${elapsed}s"
          done

      - name: 🧪 執行店家後台 E2E
        run: pnpm exec playwright test --project=admin-real
        env:
          E2E_ADMIN_URL: http://localhost:3001
          WORKFLOW_API_URL: http://localhost:8787
          WORKFLOW_AUTH_USERNAME: owner1
          WORKFLOW_AUTH_PASSWORD: owner123
          WORKFLOW_RESTAURANT_ID: 019469a0-0099-7000-8000-000000000099
          E2E_STRICT: "1"

      - name: 🛑 停止服務
        if: always()
        run: |
          pkill -f "wrangler dev" || true
          pkill -f "vite" || true

      - name: 🩺 檢查 wrangler 是否中途崩潰
        # A workerd/miniflare crash mid-run reads as "the last N specs failed
        # with `fetch failed`" and nothing else: wrangler prints an *empty*
        # error message followed by its "please create an issue" line, and
        # every detail goes to its own debug log under
        # $HOME/.config/.wrangler/logs (collected by the upload step below).
        # Say so in the job summary so the next person does not have to
        # download the artifact to learn that the Worker died rather than the
        # tests. Informational only — the failing specs already fail the job,
        # and a crash after the last spec should not turn a green run red.
        if: always()
        env:
          API_LOG: /tmp/admin-e2e-logs/api.log
          WRANGLER_LOG_DIR: ${{ env.HOME }}/.config/.wrangler/logs
        run: |
          set -eu
          echo "wrangler debug logs in ${WRANGLER_LOG_DIR}:"
          ls -1t "${WRANGLER_LOG_DIR}" || echo "  (directory missing)"
          grep -q 'If you think this is a bug then please create an issue' "${API_LOG}" 2>/dev/null || exit 0
          # wrangler names the log it wrote on the way out, so take it from
          # api.log ('Logs were written to "..."') rather than guessing. Fall
          # back to the newest file in the directory — the names are
          # wrangler-<ISO timestamp>.log, so glob order is chronological.
          LOGFILE=$(sed -n 's/.*Logs were written to "\([^"]*\)".*/\1/p' "${API_LOG}" | tail -n 1)
          if [ -z "${LOGFILE}" ]; then
            for candidate in "${WRANGLER_LOG_DIR}"/wrangler-*.log; do
              if [ -f "${candidate}" ]; then LOGFILE="${candidate}"; fi
            done
          fi
          {
            echo '### ⚠️ wrangler dev 在測試途中崩潰'
            echo ''
            echo 'api.log 出現 workers-sdk 的 crash 指紋；Worker 之後不再服務，剩下的 spec 會全部以 fetch failed 失敗。'
            echo ''
            echo '最新的 wrangler 除錯日誌（已收進本 job 的 artifact）：'
            echo ''
            echo '```'
            echo "${LOGFILE:-no wrangler-*.log under ${WRANGLER_LOG_DIR}}"
            grep -B 6 -A 2 'If you think this is a bug then please create an issue' "${API_LOG}" |
              sed 's/\x1b\[[0-9;]*m//g' | tail -n 20
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 📎 上傳日誌與報告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: admin-real-e2e
          # $HOME/.config/.wrangler/logs is where wrangler writes the debug
          # log it points at on a crash ("🪵 Logs were written to ...").
          # `wrangler dev`'s own stderr in api.log carries an empty message,
          # so without this the crash cannot be attributed after the fact.
          # Every wrangler invocation in this job writes one, so the glob is
          # never empty and if-no-files-found (default `warn`) stays useful.
          # The dot-directories need no `include-hidden-files`: upload-artifact
          # only skips hidden entries it discovers while walking, not the path
          # it was handed (verified on run 34676859069).
          path: |
            /tmp/admin-e2e-logs/
            ${{ env.HOME }}/.config/.wrangler/logs/
            playwright-report/
            test-results/
          retention-days: 7

  # E2E 測試 (mock API — no real backend needed)
  #
  # Customer/journey coverage only. The mock layer these once used
  # (tests/e2e/helpers/mock-api.ts, preAuthAdmin) was deleted in b936600f along
  # with the specs that consumed it; what remains here is the kitchen-display
  # spec and the CI-smoke preview check. Real-backend admin coverage lives in
  # the admin-real-e2e job above; real-backend integration coverage is the
  # `integration` project, which still has no scheduled runner.
  #
  # Runs inside the pinned Playwright Linux container so browser binaries
  # and system dependencies are pre-installed. Upgrading Playwright
  # requires bumping BOTH the image tag below AND the @playwright/test
  # version in package.json in the same PR.
  e2e-tests:
    name: 🎭 E2E 測試
    runs-on: ubuntu-latest
    needs: [changes, unit-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.full == 'true'))
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    env:
      HOME: /root

    steps:
      - name: 📦 Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 安裝 pnpm
        # Not corepack. Inside this container corepack prints
        # "Preparing pnpm@12.3.4+sha512... for immediate activation...", exits
        # 0 in ~300ms having fetched nothing, and the shim then dies on
        # `Cannot find module .../corepack/v1/pnpm/12.3.4/bin/pnpm.cjs`.
        # Disabling its download prompt did not change that, so the fetch is
        # not what is being skipped.
        #
        # Every other job in this workflow resolves pnpm from the same
        # `packageManager` field through this action and none of them has the
        # problem, so this one now does what they do. No version input here
        # either -- the action reads package.json, so there is still no second
        # pin to drift.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 📥 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 建置 customer-app + admin-dashboard + kitchen-display
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          pnpm build \
            --filter=makanmasak-customer-app \
            --filter=makanmasak-admin-dashboard \
            --filter=makanmasak-kitchen-display

      - name: 🚀 啟動 preview servers
        run: |
          mkdir -p /tmp/preview-logs
          (cd apps/customer-app    && pnpm exec vite preview --port 3000 --host 0.0.0.0 > /tmp/preview-logs/customer.log 2>&1 &)
          (cd apps/admin-dashboard && pnpm exec vite preview --port 3001 --host 0.0.0.0 > /tmp/preview-logs/admin.log    2>&1 &)
          (cd apps/kitchen-display && pnpm exec vite preview --port 3002 --host 0.0.0.0 > /tmp/preview-logs/kitchen.log  2>&1 &)

      - name: ⏳ 等待 preview servers 就緒
        run: |
          if ! node <<'NODE'
          (async () => {
          const urls = [
            "http://localhost:3000",
            "http://localhost:3001",
            "http://localhost:3002",
          ];
          const deadline = Date.now() + 60_000;

          for (;;) {
            const pending = [];

            for (const url of urls) {
              try {
                const response = await fetch(url);
                if (!response.ok) pending.push(`${url} -> ${response.status}`);
              } catch (error) {
                pending.push(`${url} -> ${error.cause?.code ?? error.message}`);
              }
            }

            if (pending.length === 0) {
              console.log(`Preview servers ready: ${urls.join(", ")}`);
              process.exit(0);
            }

            if (Date.now() >= deadline) {
              console.error(`Timed out waiting for preview servers:`);
              for (const item of pending) console.error(`- ${item}`);
              process.exit(1);
            }

            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          })();
          NODE
          then
            echo "customer preview log:"
            cat /tmp/preview-logs/customer.log || true
            echo "admin preview log:"
            cat /tmp/preview-logs/admin.log || true
            echo "kitchen preview log:"
            cat /tmp/preview-logs/kitchen.log || true
            exit 1
          fi

      - name: 🧪 執行 E2E 測試
        # Pushes run a small preview smoke because the full Chromium E2E suite
        # is currently too large and flaky for fast-feedback CI.
        # Manual dispatch keeps the full suite available for investigation.
        #
        # `--project=admin` used to be appended here. It pointed at
        # tests/e2e/admin, which b936600f emptied in 2026-05, so from then until
        # 2026-09 this step ran 3 tests and reported success — an empty project
        # only fails the run when *every* selected project is empty, and
        # chromium absorbed it. The admin suite now lives in `admin-real` and
        # needs a real API and a real D1, neither of which this job has: it
        # serves `vite preview`, which does not apply server.proxy, so the admin
        # app's relative /api/v1 calls have nothing behind them. That suite runs
        # in the `admin-real-e2e` job instead.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm exec playwright test --project=chromium
          else
            pnpm exec playwright test --config playwright.ci-smoke.config.ts
          fi
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_URL: http://localhost:3001
          E2E_KITCHEN_URL: http://localhost:3002

      - name: 🛑 停止測試服務器
        if: always()
        run: |
          pkill -f "vite preview" || true

      - name: 📎 上傳測試報告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

      - name: 📸 上傳測試截圖
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots-e2e
          path: test-results/
          retention-days: 7
